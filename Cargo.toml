[package]
name = "discuss"
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust CLI for live bidirectional markdown review sessions."
repository = "https://github.com/codesoda/discuss-cli"
license = "MIT"

[profile.release]
strip = true
lto = true

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
clap = { version = "4.5.50", features = ["derive"] }
comrak = { version = "0.52.0", default-features = false }
directories = "6"
encoding_rs = "0.8"
flate2 = "1.1"
open = "5.3.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
semver = "1.0"
self-replace = "1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "0.8.23"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
is-terminal = "0.4"
