name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, for example v0.6.1"
        required: true
        type: string

env:
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs_on: macos-15
          - target: x86_64-apple-darwin
            runs_on: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runs_on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: cargo build --release --target ${{ matrix.target }}
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package Unix release tarball
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          install -m 0755 "target/${{ matrix.target }}/release/discuss" dist/package/discuss
          tar -C dist/package -czf "dist/discuss-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz" discuss

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "dist/package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/discuss.exe" "$packageDir/discuss.exe"
          Compress-Archive -Path "$packageDir/discuss.exe" -DestinationPath "dist/discuss-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/discuss-${{ env.RELEASE_TAG }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum discuss-* > checksums-sha256.txt

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          PREFIX_TAG="## [${TAG}]"
          PREFIX_VERSION="## [${VERSION}]"
          awk -v prefix_tag="${PREFIX_TAG}" -v prefix_version="${PREFIX_VERSION}" '
            index($0, "## [") == 1 {
              if (in_section) {
                exit
              }
              if (index($0, prefix_tag) == 1 || index($0, prefix_version) == 1) {
                in_section = 1
              }
            }
            in_section {
              print
            }
          ' CHANGELOG.md > dist/release-notes.md

          if [ ! -s dist/release-notes.md ]; then
            echo "missing release notes for ${TAG} in CHANGELOG.md" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          overwrite_files: true
          body_path: dist/release-notes.md
          files: |
            dist/discuss-*.tar.gz
            dist/discuss-*.zip
            dist/checksums-sha256.txt
          fail_on_unmatched_files: true
