name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build --all-targets
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22

      - name: browser helper regressions
        if: runner.os == 'Linux'
        run: node --test tests/browser/block-editing.mjs tests/browser/prefs-helper.mjs tests/browser/thread-selection-quotes.mjs tests/browser/proposal-review.mjs

      - name: file tree and diff marker browser regressions
        if: runner.os == 'Linux'
        run: |
          npm install --prefix /tmp/discuss-playwright playwright@1.58.2
          /tmp/discuss-playwright/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/discuss-playwright/node_modules/playwright/index.mjs node tests/browser/file-tree-guides.mjs

      - name: live website browser e2e
        if: runner.os == 'Linux'
        run: node tests/browser/live-website-smoke.mjs

      - name: bundled demo browser e2e (offline)
        if: runner.os == 'Linux'
        run: node tests/browser/demo-scenarios-smoke.mjs
